<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<header>
    <h1>Student Login Form</h1>
</header>
<body>
    <label><b>Enter Your Name</b></label>
    <br><br>
    <input type="text" placeholder="Enter your Name">
    <br><br>
    <label><b>Enter Your E-mail</b></label>
    <br><br>
    <input type="email" placeholder="Enter Registered E-mail">
    <br><br>
    <label><b>password</b></label>
    <br><br>
    <input type="password" placeholder="Enter Your Password">
    <br><br>
    <label><b>Enter Your Mobile number</b></label>
    <br><br>
    <input type="number" placeholder="Enter your Mobie no.">
    <br><br>
    <legend><b>Course information</b></legend>
    <br>
    <label><b>Select the course in which you are interested:</b></label>
    <select>
    <option>--select course--</option>
    <option>python Full-stack</option>
    <option>Machine learning</option>
    <option>Data Analytics</option>
    <option>Digital marketing</option>
    <option>Web-development</option>
    </select>
    <br><br>
    <label><b>Men</b></label>
    <input type="radio">
    <label><b>Women</b></label>
    <input type="radio">
    <label><b>Others</b></label>
    <input type="radio">
    <br><br>
    <label><b>Skils:</b></label>
    <br><br>
    <input type="checkbox"><b>HTML</b>
    <input type="checkbox"><b>Java script</b>
    <input type="checkbox"><b>CSS</b>
    <input type="checkbox"><b>React</b>
    <input type="checkbox"><b>xango</b>
    <input type="checkbox"><b>Python</b>
    <br><br>
    <label><b>Enter Your Date of birth</b></label>
    <br><br>
    <input type="date">
    <br><br>
    <label><b>Preffered Class Timings:</b></label>
    <br><br>
    <input type="time">
    <br><br>
    <label><b>Select Cities:</b></label>
    <input list="cities">
    <datalist id="cities">
        <option value="Hyedrabad"></option>
        <option value="Bangalore"></option>
        <option value="Vishakapatnam"></option>
        <option value="Mumbai"></option>
    </datalist>
    <br><br>
    <legend><b>Additional Info.</b></legend>
    <br>
    <label><b>Upload File:</b></label>
    <input type="file">
    <br><br>
     <label><b>Enter your Address</b></label>
     <textarea rows="5" cols="10" placeholder="Enter your address"></textarea>
     <br><br>
     <b><input type="submit" value="Login"></b>
     <br>
     <b><input type="reset"  value="clear form"></b>
     <br><br>   
</body>
</html>
