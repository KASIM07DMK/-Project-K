<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essayza - AI Writing Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 300;
        }

        .main-content {
            flex: 1;
            background: white;
            border-radius: 30px 30px 0 0;
            padding: 30px 20px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .animation-section {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            height: 250px;
            position: relative;
        }

        .paper {
            width: 250px;
            height: 200px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .lines {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .line {
            width: 100%;
            height: 1px;
            background: #f0f0f0;
        }

        .text-animation {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 12px;
            color: #333;
            font-family: 'Courier New', monospace;
            height: 150px;
            overflow: hidden;
        }

        .text-animation span {
            display: block;
            animation: typewriter 0.05s steps(1) forwards;
        }

        @keyframes typewriter {
            from { width: 0; }
            to { width: 100%; }
        }

        .pen {
            position: absolute;
            width: 3px;
            height: 30px;
            background: linear-gradient(to bottom, #667eea, #764ba2);
            border-radius: 2px;
            animation: penWrite 4s ease-in-out infinite;
            transform-origin: top;
        }

        @keyframes penWrite {
            0% { left: 20px; top: 20px; opacity: 1; }
            20% { left: 30px; top: 40px; opacity: 1; }
            40% { left: 40px; top: 60px; opacity: 1; }
            60% { left: 50px; top: 80px; opacity: 1; }
            80% { left: 60px; top: 100px; opacity: 1; }
            100% { left: 20px; top: 20px; opacity: 1; }
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 18px;
            margin-top: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-card {
            padding: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option-card:active {
            transform: scale(0.98);
        }

        .option-card:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option-card.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .option-icon {
            font-size: 28px;
            min-width: 40px;
        }

        .option-details {
            flex: 1;
        }

        .option-name {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        .option-desc {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }

        .input-section {
            margin-bottom: 25px;
        }

        .input-label {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
            font-weight: 400;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-generate:active:focus {
            transform: scale(0.96);
        }

        .btn-generate:enabled {
            opacity: 0.5;
            cursor:pointer;
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .btn-reset:active {
            background: #e0e0e0;
        }

        .output-section {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
        }

        .output-section h3 {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .output-text {
            line-height: 1.8;
            color: #333;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .loading {
            text-align: center;
            padding: 30px 20px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #e74c3c;
            background: #fadbd8;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #e74c3c;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px 20px;
            font-size: 14px;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        .copy-btn:active {
            transform: scale(0.96);
        }

        .success-message {
            color: #27ae60;
            background: #d5f4e6;
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 12px;
            border-left: 4px solid #27ae60;
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 36px;
            }

            .main-content {
                padding: 20px 15px;
                margin-top: 15px;
            }

            .section-title {
                font-size: 16px;
            }

            button {
                padding: 12px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>✨ Essayza</h1>
        <p>AI-Powered Writing Studio</p>
    </div>

    <div class="main-content" id="app">
        <!-- Dynamic content renders here -->
    </div>
</div>

<script>
    const app = document.getElementById('app');

    // State
    let selectedType = null;
    let prompt = '';
    let output = '';
    let loading = false;
    let copySuccess = false;

    const writingTypes = [
        { 
            id: 'essay', 
            name: 'Essay Writing', 
            icon: '📝',
            desc: 'Structured essays with intro, body & conclusion'
        },
        { 
            id: 'notes', 
            name: 'Short Notes', 
            icon: '📌',
            desc: 'Concise, organized bullet points'
        },
        { 
            id: 'story', 
            name: 'Moral Story', 
            icon: '📚',
            desc: 'Engaging stories with meaningful lessons'
        }
    ];

    function render() {
        app.innerHTML = `
            <div class="animation-section">
                <div class="paper">
                    <div class="lines">
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                        <div class="line"></div>
                    </div>
                    <div class="text-animation">
                        <span>Writing has power...</span>
                        <span>Ideas transform minds...</span>
                        <span>Create your masterpiece</span>
                    </div>
                    <div class="pen"></div>
                </div>
            </div>

            <div class="section-title">📖 Select Writing Type</div>
            <div class="options-grid">
                ${writingTypes.map(type => `
                    <div class="option-card ${selectedType === type.id ? 'active' : ''}" onclick="selectType('${type.id}')">
                        <div class="option-icon">${type.icon}</div>
                        <div class="option-details">
                            <div class="option-name">${type.name}</div>
                            <div class="option-desc">${type.desc}</div>
                        </div>
                    </div>
                `).join('')}
            </div>

            <div class="input-section">
                <label class="input-label">✍️ Enter Your Prompt</label>
                <textarea id="promptInput" placeholder="E.g., Write an essay about the importance of education, digital transformation, climate change, or any topic you'd like..." onchange="updatePrompt(event)"></textarea>
            </div>

            <div class="button-group">
                <button class="btn-generate" onclick="generateContent()" ${!selectedType || !prompt ? 'disabled' : ''}>
                    ✨ Generate Now
                </button>
                <button class="btn-reset" onclick="resetApp()">🔄 Clear</button>
            </div>

            ${output ? `
                <div class="output-section">
                    <h3>📖 Your ${writingTypes.find(t => t.id === selectedType)?.name}</h3>
                    <div class="output-text">${output}</div>
                    <button class="copy-btn" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
                    ${copySuccess ? '<div class="success-message">✅ Copied to clipboard!</div>' : ''}
                </div>
            ` : loading ? `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Creating your ${writingTypes.find(t => t.id === selectedType)?.name}...</p>
                    <p style="font-size: 12px; margin-top: 10px; color: #999;">This may take a few seconds</p>
                </div>
            ` : ''}
        `;
        
        const promptInput = document.getElementById('promptInput');
        if (promptInput) {
            promptInput.value = prompt;
            promptInput.focus();
        }
    }

    function selectType(type) {
        selectedType = type;
        copySuccess = false;
        render();
    }

    function updatePrompt(event) {
        prompt = event.target.value;
    }

    async function generateContent() {
        if (!selectedType || !prompt) return;
        
        loading = true;
        copySuccess = false;
        render();
        
        try {
            const systemPrompts = {
                essay: 'You are an expert essay writer. Write a well-structured, compelling essay with a clear introduction, 2-3 body paragraphs with supporting details, and a strong conclusion. Make it informative and engaging.',
                notes: 'You are a concise note-taking expert. Create clear, organized, bullet-pointed notes that capture the key concepts. Use bullet points and sub-bullets for clarity. Focus on essential information.',
                story: 'You are a talented storyteller. Write an engaging moral story with meaningful lessons. Include characters, plot development, and a clear moral message. Make it inspiring and memorable.'
            };

            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'claude-sonnet-4-6',
                    max_tokens: 2000,
                    messages: [
                        {
                            role: 'user',
                            content: prompt
                        }
                    ],
                    system: systemPrompts[selectedType]
                })
            });

            const data = await response.json();
            
            if (data.content && data.content[0] && data.content[0].text) {
                output = data.content[0].text;
            } else {
                throw new Error('Unexpected response format');
            }
        } catch (error) {
            output = `Error: ${error.message}. Please check your internet connection and try again.`;
        }
        
        loading = false;
        render();
    }

    function resetApp() {
        selectedType = null;
        prompt = '';
        output = '';
        loading = false;
        copySuccess = false;
        render();
    }

    function copyToClipboard() {
        if (!output) return;
        
        const textToCopy = output;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                copySuccess = true;
                render();
                setTimeout(() => {
                    copySuccess = false;
                    render();
                }, 2000);
            }).catch(err => {
                alert('Failed to copy. Please try again.');
            });
        } else {
            // Fallback for older browsers
            const textArea = document.createElement('textarea');
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                copySuccess = true;
                render();
                setTimeout(() => {
                    copySuccess = false;
                    render();
                }, 2000);
            } catch (err) {
                alert('Failed to copy. Please try again.');
            }
            document.body.removeChild(textArea);
        }
    }

    // Initial render
    render();
</script>

</body>
</html>
