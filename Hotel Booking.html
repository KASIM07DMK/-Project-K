<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking</title>
</head>
<header>
    <link rel="stylesheet" href="STYLE4.CSS">
</header>
<body bgcolor="black">
    <div class="Bookingportal">
    <h1>DMKS Hotel Booking</h1>
    <label id="l1"><b>Enter Guest Name</b></label>
    <br><br>
    <input id="l2" type="text" placeholder="Guest name">
    <br><br>
    <label id="l3"><b>Check-in-date</b></label>
    <input id="l4" type="date">
    <br><br>
    <label id="l5"><b>Check-out-date</b></label>
    <input id="l6" type="date">
    <br><br>
    <label id="l7"><b>Number of Guests</b></label>
    <br><br>
    <input id="l8" type="Number" placeholder="Number">
    <br><br>
    <label id="l9"><b>Room Type</b></label>
    <br><br>
    <select id="l10">
        <option>Select Room Type</option>
        <option>AC</option>
        <option>NON-AC</option>
    </select>
    <br><br>
    <b><input id="l11" type="submit" value="Book Room"></b>
    </div>
</body>
</html>
